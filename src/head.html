<title>18분 상황실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen situation room. Threat banner + ticker on top; left = real-geography track board + telemetry; center = report feed; right = decisions/tasks + conference line. Single committed dark theme. */
:root{
  --bg:#070b10; --panel:#0e151d; --panel2:#121b25; --line:#1e2b39; --fg:#dde6ee; --muted:#78889a;
  --amber:#f3b43a; --red:#ff4a3d; --green:#48c98a; --blue:#4ea4e6; --violet:#cdaaff;
  --display:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:13px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{position:relative;height:100%}
.wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);z-index:3}
.app{height:100%;display:flex;flex-direction:column;gap:6px;min-height:0}
.flash .app{animation:flash .35s steps(2) 3}
@keyframes flash{50%{filter:brightness(1.6) saturate(1.4)}}
.banner{display:none;font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:var(--red);color:#1a0300;padding:3px 10px;font-weight:600;text-align:center}
.banner.on{display:block}
.top{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:6px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--fg);font-weight:600}
.clock{font-family:var(--display);font-size:38px;font-weight:600;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--amber);line-height:1}
.clock.crit{color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.status{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{font-family:var(--display);font-size:10px;letter-spacing:.08em;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted);text-transform:uppercase;white-space:nowrap;background:transparent}
.pill.on{border-color:var(--amber);color:var(--amber)} .pill.red{border-color:var(--red);color:var(--red)} .pill.green{border-color:var(--green);color:var(--green)}
.wall{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-size:10px;border-bottom:1px solid var(--line);padding:3px 0}
.clocks{display:flex;gap:12px;flex-wrap:wrap}
.clocks div{color:var(--muted);letter-spacing:.08em}
.clocks b{display:block;color:var(--fg);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.lamps{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.lamp{display:flex;align-items:center;gap:4px;color:var(--muted);letter-spacing:.06em;border:1px solid var(--line);padding:2px 6px;border-radius:3px}
.lamp i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.lamp.off i{background:var(--red);box-shadow:0 0 6px var(--red);animation:blink .8s steps(2) infinite}
.lamp.warn i{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.eam{flex-basis:100%;color:var(--amber);letter-spacing:.14em;white-space:nowrap;overflow:hidden;min-height:0}
.eam:empty{display:none}
.eam span{display:inline-block;padding-left:100%;animation:tick 28s linear infinite}
.ticker{font-family:var(--display);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;border-bottom:1px solid var(--line);padding:2px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 40s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1.25fr 1.15fr;gap:6px}
.col{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{font-family:var(--display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:5px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.pb{flex:1;min-height:0;overflow:auto;padding:8px 10px}
canvas{width:100%;height:auto;display:block;max-width:100%}
.tele{display:grid;grid-template-columns:repeat(4,1fr);gap:5px 8px;font-family:var(--display);font-size:11px;padding:7px 10px;border-top:1px solid var(--line)}
.tele span{color:var(--muted);display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.tele b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--fg)}
.tele b.u{color:var(--amber)} .tele b.stale{color:var(--red);animation:blink 1s steps(2) infinite}
.filters{display:flex;gap:3px}
.filters button{background:transparent;border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-family:var(--display);font-size:9px;letter-spacing:.06em;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}
.msg{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);animation:in .2s ease-out}
.msg.hide{display:none}
.msg .t{font-family:var(--display);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.msg .src{font-family:var(--display);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.msg .src.intel{color:var(--amber)} .msg .src.alert{color:var(--red)} .msg .src.me{color:var(--green)} .msg .src.pres{color:var(--violet)} .msg .src.noise{color:var(--muted)}
.msg .conf{margin-left:6px;font-size:9px;color:var(--muted);letter-spacing:.04em}
.msg p{margin:1px 0 0}
.msg.alert p{color:#ffd9d6} .msg.noise p{color:var(--muted)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{border:1px solid var(--amber);border-radius:4px;padding:8px 10px;margin-bottom:7px;background:rgba(243,180,58,.05);animation:in .2s ease-out}
.card.task{border-color:var(--blue);background:rgba(78,164,230,.05)}
.card h3{margin:0 0 2px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.card h3 small{font-family:var(--display);font-weight:500;color:var(--amber);font-variant-numeric:tabular-nums}
.card.task h3 small{color:var(--blue)}
.card .ask{color:var(--muted);font-size:12px;margin:0 0 6px}
.card .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0 7px}
.card .bar i{display:block;height:100%;background:var(--amber);width:100%;transition:width .25s linear}
.card.task .bar i{background:var(--blue)}
.card.late{border-color:var(--red);background:rgba(255,74,61,.07);box-shadow:0 0 0 2px rgba(255,74,61,.15)} .card.late .bar i{background:var(--red)} .card.late h3 small{color:var(--red)}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{text-align:left;background:transparent;border:1px solid var(--line);border-radius:3px;padding:6px 8px;font-size:12px;line-height:1.35}
.opt:hover{border-color:var(--fg)}
.opt small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
.chk{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.chk label{display:flex;gap:6px;align-items:flex-start;font-size:12px;cursor:pointer}
.chk input{margin-top:3px}
.empty{color:var(--muted);font-size:12px;padding:6px 0}
.conf{display:flex;flex-direction:column;gap:5px}
.who{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:12px;align-items:start}
.who b{font-family:var(--display);font-size:10px;letter-spacing:.06em;color:var(--violet);font-weight:500;padding-top:2px}
.who.hot span{color:#ffe3b0}
.conf.dead{opacity:.35}
.calls{display:flex;gap:4px;flex-wrap:wrap;padding:6px 10px;border-top:1px solid var(--line)}
.calls button{background:transparent;border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:11px}
.calls button:hover:not(:disabled){border-color:var(--fg)} .calls button:disabled{opacity:.35;cursor:default}
.calls button.fix{border-color:var(--red);color:var(--red);animation:blink 1.2s steps(2) infinite}
.ring{position:absolute;left:50%;top:12%;transform:translateX(-50%);width:min(580px,92%);background:#1b0f10;border:2px solid var(--red);border-radius:6px;padding:12px 14px;z-index:6;box-shadow:0 0 0 6px rgba(255,74,61,.15),0 20px 60px rgba(0,0,0,.6);animation:ringin .2s ease-out}
@keyframes ringin{from{transform:translate(-50%,-10px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.ring h3{margin:0;font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);display:flex;justify-content:space-between}
.ring p{margin:6px 0 8px;font-size:14px;font-weight:500}
.ring .opt{border-color:#4a2a2a}
.ring .bar{height:3px;background:#3a1a1a;margin:0 0 8px;overflow:hidden}.ring .bar i{display:block;height:100%;background:var(--red)}
.overlay{position:absolute;inset:0;background:rgba(7,11,16,.97);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:8}
.sheet{max-width:660px;width:100%}
.sheet h1{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.02em;margin:0 0 6px;text-wrap:balance}
.sheet .kicker{font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
.sheet p{max-width:64ch;margin:0 0 10px}
.sheet .muted{color:var(--muted)}
.speed{display:flex;gap:6px;margin:12px 0 16px;flex-wrap:wrap}
.speed button{background:transparent;border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-family:var(--display);font-size:11px}
.speed button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.btn{background:transparent;border:1px solid var(--line);border-radius:3px;padding:7px 12px;font-size:13px}
.btn.primary{background:var(--amber);color:#1a1200;border-color:var(--amber);font-weight:600}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.vbox{border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.vbox h4,.h4{margin:0 0 4px;font-family:var(--display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vbox ul{margin:0;padding-left:16px;font-size:12px}
.score{font-family:var(--display);font-size:11px;color:var(--muted);display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 12px;margin-bottom:14px}
.score b{color:var(--fg);font-weight:500}
.score b.bad{color:var(--red)} .score b.good{color:var(--green)}
.tl{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:0 0 14px;max-height:150px;overflow:auto}
.tl div b{font-family:var(--display);font-weight:500;color:var(--amber);margin-right:6px}
.scn{font-family:var(--display);font-size:11px;color:var(--muted);margin-bottom:10px}
.scn b{color:var(--amber);font-weight:500}
@media (max-width:1000px){.grid{grid-template-columns:1fr 1fr}.col.left{grid-column:1/-1;max-height:42vh}.clock{font-size:26px}}
@media (max-width:640px){body{overflow:auto}.app{height:auto}.grid{grid-template-columns:1fr}.col.left{max-height:none}.pb{max-height:38vh}.verdict,.score{grid-template-columns:1fr 1fr}.ring{position:fixed;top:auto;bottom:12px}.tele{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){.msg,.card,.ring{animation:none}.clock.crit,.calls button.fix,.tele b.stale{animation:none}.flash .app{animation:none}.ticker span{animation:none;padding-left:0}}

.role{font-family:var(--display);font-size:10px;letter-spacing:.1em;color:var(--amber);border:1px solid var(--amber);padding:2px 7px;border-radius:3px;text-transform:uppercase}
.kc{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-top:1px solid var(--line);font-family:var(--display);font-size:10.5px}
.kc .step{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;color:var(--muted);letter-spacing:.06em}
.kc .step i{width:8px;height:8px;border-radius:50%;border:1px solid var(--line)}
.kc .step.done{color:var(--fg)} .kc .step.done i{background:var(--green);border-color:var(--green)}
.kc .step.live{color:var(--amber)} .kc .step.live i{background:var(--amber);border-color:var(--amber);animation:blink .6s steps(2) infinite}
.kc .step.fail{color:var(--red)} .kc .step.fail i{background:var(--red);border-color:var(--red)}
.gbi{display:flex;gap:6px;padding:0 10px 8px;flex-wrap:wrap}
.gbi div{font-family:var(--display);font-size:10px;border:1px solid var(--line);padding:3px 7px;border-radius:3px;color:var(--muted)}
.gbi div.armed{border-color:var(--amber);color:var(--amber)} .gbi div.away{border-color:var(--blue);color:var(--blue)} .gbi div.hit{border-color:var(--green);color:var(--green)} .gbi div.miss{border-color:var(--red);color:var(--red)}
.folder{padding:8px 10px;overflow:auto}
.opt3{border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;background:var(--panel2);cursor:pointer}
.opt3 h4{margin:0;font-size:13px;font-weight:600;grid-column:1/-1}
.opt3 .m{font-family:var(--display);font-size:10px;color:var(--muted);letter-spacing:.06em}
.opt3 .m b{color:var(--fg);font-weight:500;display:block;font-size:12px}
.opt3.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(243,180,58,.2)}
.opt3.hold{border-style:dashed}
.biscuit{font-family:var(--display);border:1px solid var(--amber);border-radius:4px;padding:8px 10px;margin:8px 10px;background:#1a1407}
.biscuit .lab{font-size:9px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
.biscuit .code{font-size:16px;font-weight:600;letter-spacing:.14em;margin-top:2px}
.brief{font-family:var(--display);font-size:11px;background:#111;border:1px solid var(--line);padding:8px 10px;margin:8px 10px;color:#cfd8e0;white-space:pre-wrap;line-height:1.5}
.brief .h{color:var(--amber);letter-spacing:.14em;font-size:9px}
.acts{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.acts div{flex:1;min-width:150px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12px}
.acts div b{display:block;font-family:var(--display);font-size:10px;letter-spacing:.12em;color:var(--amber);margin-bottom:3px}
.acts div.done{opacity:.5}
.handoff{font-family:var(--display);font-size:11px;background:#111;border:1px solid var(--line);padding:8px 10px;margin:0 0 12px;color:#cfd8e0;white-space:pre-wrap;line-height:1.5}

.say{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--line)}
.say input{flex:1;min-width:0;background:#0a1016;border:1px solid var(--line);border-radius:3px;color:var(--fg);padding:6px 8px;font:inherit;font-size:12px}
.say input:focus{outline:2px solid var(--amber);outline-offset:1px}
.say button{background:transparent;border:1px solid var(--amber);color:var(--amber);border-radius:3px;padding:6px 10px;font-size:12px}
.say button:disabled{opacity:.4}
.stances{display:flex;gap:4px;flex-wrap:wrap;padding:0 0 6px}
.stances span{font-family:var(--display);font-size:9px;letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--muted)}
.stances span b{color:var(--violet);font-weight:500}
.aiTag{font-family:var(--display);font-size:9px;color:var(--green);letter-spacing:.1em}
.aiTag.off{color:var(--muted)}
.who.ai b::after{content:" ·";color:var(--green)}

.tabs{display:none}
@media (max-width:640px){
  body{overflow:hidden;padding-block:6px}
  .app{height:100%}
  .top{gap:8px}.brand{display:none}.clock{font-size:30px}.status .pill{font-size:9px;padding:2px 5px}#pGmd,#pPres{display:none}
  .wall .clocks div:nth-child(n+3){display:none}.wall .lamps{display:none}.eam{font-size:9px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:2px 0 4px}
  .tabs button{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 4px;font-family:var(--display);font-size:12px;letter-spacing:.06em;color:var(--muted);min-height:40px}
  .tabs button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
  .tabs button i{position:absolute;top:4px;right:6px;font-style:normal;font-size:9px;background:var(--red);color:#fff;border-radius:8px;padding:0 5px;min-width:14px;text-align:center}
  .grid{display:block;min-height:0;height:100%}
  .grid [data-panel]{display:none;height:100%;max-height:none}
  .grid .col.left,.grid .col.right{display:none;height:100%}
  .grid[data-tab="board"] .col.left{display:flex}
  .grid[data-tab="feed"] [data-panel="feed"]{display:flex}
  .grid[data-tab="dec"] .col.right{display:flex}.grid[data-tab="dec"] [data-panel="dec"]{display:flex}
  .grid[data-tab="conf"] .col.right{display:flex}.grid[data-tab="conf"] [data-panel="conf"]{display:flex}
  .pb{max-height:none}
  .opt,.calls button,.say button,.btn{min-height:44px;font-size:13.5px}
  .opt small{font-size:11.5px}
  .card h3{font-size:14px}.card .ask{font-size:12.5px}
  .msg{grid-template-columns:40px 1fr;font-size:13px}.msg p{font-size:13px}
  .tele{grid-template-columns:repeat(3,1fr);font-size:11.5px}
  .ring{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;transform:none;border-radius:10px 10px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.7);animation:none}
  .ring p{font-size:16px}.ring .opt{min-height:48px;font-size:14px}
  .folder{max-height:60vh}.opt3{padding:10px 12px}.opt3 h4{font-size:14px}
  .sheet h1{font-size:22px}.acts{flex-direction:column}
}
</style>
